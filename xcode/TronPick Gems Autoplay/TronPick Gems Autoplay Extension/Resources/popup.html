<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gems Autoplay</title>
    <style>
      :root { color-scheme: dark; }
      body {
        width: 292px; margin: 0; padding: 12px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        background: #1f2a35; color: #e8eef4;
      }
      h1 { font-size: 13px; margin: 0 0 2px; display: flex; align-items: center; gap: 7px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #6b7a89; }
      .dot.on { background: #49c96d; box-shadow: 0 0 7px #49c96d; }
      .status { color: #9fb3c6; font-size: 11.5px; margin: 0 0 10px; min-height: 15px; }
      .card { background: #182129; border: 1px solid #31404f; border-radius: 8px;
              padding: 9px 10px; margin-bottom: 10px; }
      .grid { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; }
      .grid span:nth-child(odd) { color: #8fa3b5; }
      .grid span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
      .pos { color: #5fd18a; } .neg { color: #ef7d7d; }
      label { display: block; color: #8fa3b5; font-size: 11px; margin: 8px 0 3px; }
      input[type="text"], input[type="number"] {
        width: 100%; box-sizing: border-box; padding: 6px 8px;
        background: #101820; border: 1px solid #35485c; border-radius: 5px;
        color: #e8eef4; font: inherit; font-size: 12px;
      }
      .row { display: flex; gap: 8px; }
      .row > div { flex: 1; }
      .hint { color: #6d8296; font-size: 10.5px; margin-top: 3px; }
      button {
        width: 100%; padding: 9px 0; border: 0; border-radius: 6px;
        font: 600 13px/1 inherit; color: #fff; cursor: pointer;
      }
      #toggle.go { background: #3fa2e8; } #toggle.go:hover { background: #57b0ec; }
      #toggle.no { background: #d9534f; } #toggle.no:hover { background: #e0625e; }
      .sub { display: flex; gap: 7px; margin-top: 7px; }
      .sub button { background: #31404f; font-weight: 500; font-size: 11.5px; padding: 6px 0; }
      .sub button:hover { background: #3c4e60; }
      .cbrow { display: flex; align-items: center; gap: 6px; margin-top: 9px;
               color: #8fa3b5; font-size: 11.5px; }
      pre { margin: 9px 0 0; padding: 8px; background: #101820; border-radius: 6px;
            font-size: 10px; color: #8fa3b5; max-height: 130px; overflow: auto;
            white-space: pre-wrap; display: none; }
      pre.show { display: block; }
      .warn { background: #3a2a20; border-color: #6b4a2e; color: #e0b48a; font-size: 11.5px; }
    </style>
  </head>
  <body>
    <h1><span class="dot" id="dot"></span> Gems Autoplay</h1>
    <p class="status" id="status">Connecting…</p>

    <div class="card" id="statsCard">
      <div class="grid">
        <span>Rounds</span><span id="s-rounds">0</span>
        <span>Won / Lost</span><span id="s-wl">0 / 0</span>
        <span>Lost on pick 1 / 2</span><span id="s-picks">0 / 0</span>
        <span>Balance</span><span id="s-bal">–</span>
        <span>Net</span><span id="s-net">–</span>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="betAmount">Bet amount</label>
        <input type="text" id="betAmount" placeholder="leave as-is" inputmode="decimal" />
      </div>
      <div>
        <label for="minBalance">Stop below balance</label>
        <input type="text" id="minBalance" placeholder="0" inputmode="decimal" />
      </div>
    </div>

    <div class="row">
      <div>
        <label for="lowBalanceAt">Below balance</label>
        <input type="text" id="lowBalanceAt" placeholder="off" inputmode="decimal" />
      </div>
      <div>
        <label for="lowBet">…bet this instead</label>
        <input type="text" id="lowBet" placeholder="off" inputmode="decimal" />
      </div>
    </div>

    <div class="row">
      <div>
        <label for="stopOnProfit">Take profit (+)</label>
        <input type="text" id="stopOnProfit" placeholder="off" inputmode="decimal" />
      </div>
      <div>
        <label for="stopOnLoss">Stop loss (−)</label>
        <input type="text" id="stopOnLoss" placeholder="off" inputmode="decimal" />
      </div>
    </div>

    <div class="row">
      <div>
        <label for="maxRounds">Max rounds</label>
        <input type="text" id="maxRounds" placeholder="unlimited" inputmode="numeric" />
      </div>
      <div>
        <label for="roundDelay">Delay between rounds (ms)</label>
        <input type="text" id="roundDelay" placeholder="900" inputmode="numeric" />
      </div>
    </div>

    <div class="cbrow">
      <input type="checkbox" id="hud" /> <label for="hud" style="margin:0">Show panel on the page</label>
    </div>
    <div class="cbrow">
      <input type="checkbox" id="keepAwake" />
      <label for="keepAwake" style="margin:0">Keep the Mac awake while running</label>
    </div>

    <div style="margin-top: 11px">
      <button id="toggle" class="go">Start</button>
      <div class="sub">
        <button id="reset">Reset stats</button>
        <button id="diagnose">Diagnose</button>
      </div>
    </div>

    <pre id="out"></pre>

    <script src="popup.js"></script>
  </body>
</html>
